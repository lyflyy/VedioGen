[project]
name = "vediogen-api"
version = "0.1.0"
description = "VedioGen P0 control API"
requires-python = ">=3.13"
dependencies = [
  "cryptography>=44.0.0",
  "fastapi>=0.115.6",
  "httpx>=0.28.1",
  "jsonschema>=4.23.0",
  "pydantic-settings>=2.7.1",
  "psycopg[binary]>=3.2.3",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.4",
  "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vediogen_api"]
