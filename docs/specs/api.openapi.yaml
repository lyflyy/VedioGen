          $ref: "#/components/schemas/Uuid"
        projectId:
          $ref: "#/components/schemas/Uuid"
        storyboardVersionId:
          $ref: "#/components/schemas/Uuid"
        routingPolicyVersionId:
          $ref: "#/components/schemas/Uuid"
        status:
          enum: [queued, preparing, running, composing, inspecting, needs_attention, cancel_requested, completed, failed, cancelled]
        costCny:
          type: string
          pattern: "^(0|[1-9][0-9]*)(\\.[0-9]{1,4})?$"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
    GenerationRunDetail:
      allOf:
        - $ref: "#/components/schemas/GenerationRun"
