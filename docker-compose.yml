services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vediogen
      POSTGRES_USER: vediogen
      POSTGRES_PASSWORD: vediogen-local
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vediogen"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - vediogen-postgres:/var/lib/postgresql/data

volumes:
  vediogen-postgres:
